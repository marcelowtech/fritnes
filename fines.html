<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fines — treino de academia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0B1220;
    --chalk: #F5F8FF;
    --chalk-dim: #E3EAF7;
    --brass: #2F6FED;
    --brass-dim: #1B4FC2;
    --clay: #E5484D;
    --sage: #16A34A;
    --line: rgba(11,18,32,0.10);
    --font-display: 'Sora', sans-serif;
    --font-body: 'Inter', sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  :root:not([data-theme="light"]) {
    --bg: #0B1220;
    --surface: #111A2E;
    --surface-2: #182541;
    --text: #F5F8FF;
    --text-dim: #93A4C3;
    --line: rgba(245,248,255,0.10);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F5F8FF;
      --surface: #FFFFFF;
      --surface-2: #EAF1FF;
      --text: #0B1220;
      --text-dim: #5B6B85;
      --line: rgba(11,18,32,0.10);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1220; --surface: #111A2E; --surface-2: #182541;
    --text: #F5F8FF; --text-dim: #93A4C3; --line: rgba(245,248,255,0.10);
  }
  :root[data-theme="light"] {
    --bg: #F5F8FF; --surface: #FFFFFF; --surface-2: #EAF1FF;
    --text: #0B1220; --text-dim: #5B6B85; --line: rgba(11,18,32,0.10);
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  h1, h2, h3, .display { font-family: var(--font-display); text-transform: none; letter-spacing: 0.2px; }

  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; }

  #app { display: flex; min-height: 100vh; }

  /* ---- Sidebar / nav ---- */
  .sidebar {
    width: 230px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding: 28px 18px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; padding: 0 6px; }
  .brand .mark { width: 10px; height: 22px; border-radius: 3px; background: linear-gradient(180deg, var(--brass), var(--brass-dim)); display: inline-block; }
  .brand h1 { font-size: 22px; margin: 0; font-weight: 700; }
  .brand span { font-size: 11px; color: var(--text-dim); }

  nav.primary { display: flex; flex-direction: column; gap: 2px; }
  nav.primary button {
    all: unset; display: flex; align-items: center; gap: 10px;
    padding: 11px 12px; border-radius: 10px; color: var(--text-dim);
    font-size: 14.5px; font-weight: 500;
  }
  nav.primary button:hover { background: var(--surface-2); color: var(--text); }
  nav.primary button.active { background: var(--surface-2); color: var(--brass); border-left: 3px solid var(--brass); padding-left: 9px; font-weight: 700; }
  nav.primary .ico { width: 18px; text-align: center; opacity: 0.9; }

  .who { margin-top: auto; border-top: 1px solid var(--line); padding-top: 16px; display: flex; align-items: center; gap: 10px; }
  .who img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 2px solid var(--brass); }
  .who .name { font-size: 13.5px; font-weight: 600; line-height: 1.2; }
  .who .obj { font-size: 11.5px; color: var(--text-dim); }

  /* ---- Mobile bottom nav ---- */
  .mobile-nav { display: none; }

  /* ---- Main content ---- */
  main { flex: 1; min-width: 0; padding: 36px 44px 90px; max-width: 980px; }
  .eyebrow-free-title { font-size: 30px; margin: 0 0 6px; font-weight: 700; }
  .subtitle { color: var(--text-dim); margin: 0 0 30px; font-size: 15px; max-width: 60ch; }

  .section { margin-bottom: 44px; }
  .section > h2 { font-size: 19px; margin: 0 0 4px; font-weight: 600; }
  .section > .hint { color: var(--text-dim); font-size: 13.5px; margin: 0 0 16px; }

  /* Goal picker */
  .goal-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .goal-chip {
    all: unset; padding: 9px 18px; border: 1.5px solid var(--line); border-radius: 999px;
    font-size: 13.5px; font-weight: 500; color: var(--text-dim);
  }
  .goal-chip.active { border-color: var(--brass); color: #fff; background: var(--brass); box-shadow: 0 4px 14px rgba(47,111,237,0.30); }

  /* Day list */
  .day-list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .day-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 4px; border-bottom: 1px solid var(--line); gap: 16px;
  }
  .day-row .d-name { font-weight: 600; font-size: 15.5px; }
  .day-row .d-meta { color: var(--text-dim); font-size: 12.5px; margin-top: 2px; }
  .btn {
    all: unset; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 700; box-shadow: 0 4px 14px rgba(47,111,237,0.28);
    background: var(--brass); color: #1C1B1A; white-space: nowrap;
  }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .btn.small { padding: 6px 10px; font-size: 12px; }
  .btn:active { transform: translateY(1px); }

  /* Exercise detail */
  .ex-list { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--line); }
  .ex-row { padding: 14px 4px; border-bottom: 1px solid var(--line); }
  .ex-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; cursor: pointer; }
  .ex-head .ex-name { font-weight: 600; font-size: 14.5px; }
  .ex-head .ex-scheme { color: var(--brass); font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .ex-tip { color: var(--text-dim); font-size: 13px; margin-top: 8px; line-height: 1.5; display: none; }
  .ex-row.open .ex-tip { display: block; }
  .ex-row .ex-muscle { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
  .ex-icon-wrap {
    width: 46px; height: 46px; flex-shrink: 0; border-radius: 12px;
    background: var(--surface-2); padding: 4px; transition: width .15s, height .15s;
  }
  .ex-row.open .ex-icon-wrap { width: 68px; height: 68px; }
  .ex-icon-svg { width: 100%; height: 100%; display: block; }

  /* Cards for dashboard */
  .today-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    padding: 24px 26px; box-shadow: 0 8px 28px rgba(47,111,237,0.10);
  }
  .today-card .k { color: var(--text-dim); font-size: 12.5px; }
  .today-card .v { font-size: 22px; font-weight: 700; font-family: var(--font-display); margin: 4px 0 14px; }

  .stat-row { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 6px; }
  .stat { min-width: 110px; }
  .stat .num { font-family: var(--font-display); font-size: 26px; font-weight: 600; }
  .stat .lbl { font-size: 12px; color: var(--text-dim); }

  /* Log workout form */
  select, input[type=text], input[type=number], textarea {
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    padding: 10px 13px; border-radius: 10px; font-size: 14px; font-family: inherit; width: 100%;
  }
  label.field { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 5px; }
  .field-wrap { margin-bottom: 16px; max-width: 360px; }

  .set-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .set-table th { text-align: left; font-size: 11.5px; color: var(--text-dim); font-weight: 500; padding: 0 8px 6px 0; }
  .set-table td { padding: 4px 8px 4px 0; }
  .set-table input { width: 72px; padding: 7px 8px; }
  .rm-set { all: unset; color: var(--clay); font-size: 12px; cursor: pointer; padding: 4px; }

  .log-ex-block { border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; background: var(--surface); }
  .log-ex-head { display: flex; justify-content: space-between; align-items: center; }
  .log-ex-head .nm { font-weight: 600; font-size: 15px; }
  .remove-ex { all: unset; color: var(--text-dim); font-size: 18px; cursor: pointer; line-height: 1; padding: 2px 6px; }

  /* history list */
  .hist-item { border-bottom: 1px solid var(--line); padding: 14px 4px; }
  .hist-item .hd { display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 600; }
  .hist-item .hd .date { color: var(--text-dim); font-weight: 500; font-size: 12.5px; }
  .hist-item ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: var(--text-dim); }

  .empty { color: var(--text-dim); font-size: 14px; padding: 24px 12px; border: 1.5px dashed var(--line); border-radius: 14px; text-align: center; }

  .tips-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .tip-card { border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; background: var(--surface); }
  .tip-card h3 { font-size: 14.5px; margin: 0 0 6px; font-weight: 600; }
  .tip-card p { font-size: 13.5px; color: var(--text-dim); margin: 0; line-height: 1.55; }

  select#pick-exercise-chart { max-width: 320px; }
  .chart-wrap { margin-top: 18px; }
  .chart-wrap svg { width: 100%; height: auto; }

  .signedout { max-width: 460px; margin: 80px auto; text-align: center; color: var(--text-dim); }
  .signedout h2 { color: var(--text); }

  @media (max-width: 860px) {
    .sidebar { display: none; }
    main { padding: 24px 18px 100px; max-width: 100%; }
    .mobile-nav {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--surface); border-top: 1px solid var(--line);
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px));
      justify-content: space-around; z-index: 10;
    }
    .mobile-nav button { all: unset; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-dim); font-size: 10.5px; padding: 4px 8px; }
    .mobile-nav button.active { color: var(--brass); }
    .mobile-nav .ico { font-size: 17px; }
    .tips-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

function iconSVG(key){
  const shapes = ICONS[key];
  if (!shapes) return '<svg viewBox="0 0 100 100" class="ex-icon-svg"></svg>';
  let inner = "";
  shapes.forEach(s => {
    if (s[0] === 'line') {
      const [,x1,y1,x2,y2,tag] = s;
      const ground = tag === 'g';
      const dash = tag === 'd';
      inner += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${ground ? 'var(--line)' : 'var(--brass)'}" stroke-width="${ground ? 2 : 5}" stroke-linecap="round"${dash ? ' stroke-dasharray="3,4"' : ''}/>`;
    } else if (s[0] === 'circle') {
      const [,cx,cy,r] = s;
      inner += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--brass)"/>`;
    }
  });
  return `<svg viewBox="0 0 100 100" class="ex-icon-svg">${inner}</svg>`;
}

/* ============================= LOCAL ACCOUNTS (this device only) ============================= */
const ACCOUNTS_KEY = "ferro_accounts_v1";
const SESSION_KEY = "ferro_current_user_v1";

function loadAccounts(){
  try { return JSON.parse(localStorage.getItem(ACCOUNTS_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveAccounts(accs){
  try { localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accs)); }
  catch(e){ console.warn("could not persist accounts", e); }
}
async function hashPassword(username, password){
  try {
    const enc = new TextEncoder().encode("ferro::" + username.toLowerCase() + "::" + password);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  } catch(e) {
    // fallback if subtle crypto is unavailable for any reason
    let h = 0;
    const s = username + "::" + password;
    for (let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
    return "fallback" + h;
  }
}

async function signup(username, password){
  username = (username||"").trim();
  if (username.length < 3) return "Escolha um nome de usuário com pelo menos 3 letras.";
  if ((password||"").length < 4) return "A senha precisa ter pelo menos 4 caracteres.";
  const accs = loadAccounts();
  const key = username.toLowerCase();
  if (accs[key]) return "Esse nome de usuário já existe neste aparelho. Tente entrar, ou escolha outro nome.";
  const passwordHash = await hashPassword(username, password);
  accs[key] = {
    username,
    passwordHash,
    profile: { goal: "manutencao", level: "iniciante" },
    sessions: []
  };
  saveAccounts(accs);
  localStorage.setItem(SESSION_KEY, key);
  loadCurrentUser(key, accs);
  return null;
}

async function login(username, password){
  username = (username||"").trim();
  const accs = loadAccounts();
  const key = username.toLowerCase();
  const acc = accs[key];
  if (!acc) return "Não existe uma conta com esse nome neste aparelho. Quer criar uma?";
  const passwordHash = await hashPassword(acc.username, password);
  if (passwordHash !== acc.passwordHash) return "Senha incorreta.";
  localStorage.setItem(SESSION_KEY, key);
  loadCurrentUser(key, accs);
  return null;
}

function loadCurrentUser(key, accs){
  accs = accs || loadAccounts();
  const acc = accs[key];
  if (!acc) return;
  state.authed = true;
  state.viewer = { username: acc.username };
  state.profile = Object.assign({ goal: "manutencao", level: "iniciante" }, acc.profile || {});
  state.sessions = (acc.sessions || []).slice().sort((a,b) => new Date(b.date) - new Date(a.date));
}

function logout(){
  localStorage.removeItem(SESSION_KEY);
  state.authed = false;
  state.viewer = null;
  state.profile = { goal: "manutencao", level: "iniciante" };
  state.sessions = [];
  state.view = "dashboard";
  render();
}

/* ============================= BOOT ============================= */
function boot(){
  try {
    const key = localStorage.getItem(SESSION_KEY);
    if (key) {
      const accs = loadAccounts();
      if (accs[key]) loadCurrentUser(key, accs);
      else localStorage.removeItem(SESSION_KEY);
    }
  } catch(e) { console.warn("could not restore session", e); }
  render();
}

async function saveProfile(patch){
  state.profile = Object.assign({}, state.profile, patch);
  render();
  persistCurrentUser();
}

async function saveSession(session){
  session.id = "s-" + Date.now();
  state.sessions = [session, ...state.sessions];
  persistCurrentUser();
}

function persistCurrentUser(){
  if (!state.viewer) return;
  const accs = loadAccounts();
  const key = state.viewer.username.toLowerCase();
  if (!accs[key]) return;
  accs[key].profile = state.profile;
  accs[key].sessions = state.sessions;
  saveAccounts(accs);
}

function wireAuthInteractions(){
  document.querySelectorAll("[data-authmode]").forEach(b => {
    b.addEventListener("click", () => { state.authMode = b.getAttribute("data-authmode"); state.authError = ""; render(); });
  });
  const submit = document.getElementById("auth-submit");
  const userInput = document.getElementById("auth-username");
  const passInput = document.getElementById("auth-password");
  const doSubmit = async () => {
    const u = userInput.value, p = passInput.value;
    const err = state.authMode === "signup" ? await signup(u,p) : await login(u,p);
    if (err) { state.authError = err; render(); }
    else { state.authError = ""; render(); }
  };
  submit.addEventListener("click", doSubmit);
  [userInput, passInput].forEach(inp => inp.addEventListener("keydown", (e) => { if (e.key === "Enter") doSubmit(); }));
  userInput.focus();
}

    nameInput.oninput = (e) => { exr.name = e.target.value; };
    head.appendChild(nameInput);

    if (state.draftLog.exercises.length > 1) {
      const rm = document.createElement("button");
      rm.className = "remove-ex";
      rm.textContent = "✕";
      rm.title = "Remover exercício";
      rm.onclick = () => { state.draftLog.exercises.splice(i,1); renderLogExercises(container); };
      head.appendChild(rm);
    }
    block.appendChild(head);

    const table = document.createElement("table");
    table.className = "set-table";
    table.innerHTML = `<tr><th>Série</th><th>Reps</th><th>Carga (kg)</th><th></th></tr>`;
    exr.sets.forEach((s, si) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${si+1}</td>`;
      const repsTd = document.createElement("td");
      const repsInput = document.createElement("input");
      repsInput.type = "number"; repsInput.min = "0"; repsInput.value = s.reps;
      repsInput.oninput = (e) => { s.reps = e.target.value; };
      repsTd.appendChild(repsInput);
      tr.appendChild(repsTd);

      const wTd = document.createElement("td");
      const wInput = document.createElement("input");
      wInput.type = "number"; wInput.min = "0"; wInput.step = "0.5"; wInput.value = s.weight;
      wInput.oninput = (e) => { s.weight = e.target.value; };
      wTd.appendChild(wInput);
      tr.appendChild(wTd);

      const rmTd = document.createElement("td");
      if (exr.sets.length > 1) {
        const rmBtn = document.createElement("button");
        rmBtn.className = "rm-set"; rmBtn.textContent = "remover";
        rmBtn.onclick = () => { exr.sets.splice(si,1); renderLogExercises(container); };
        rmTd.appendChild(rmBtn);
      }
      tr.appendChild(rmTd);
      table.appendChild(tr);
    });
    block.appendChild(table);

    const addSet = document.createElement("button");
    addSet.className = "btn ghost small";
    addSet.style.marginTop = "10px";
    addSet.textContent = "+ série";
    addSet.onclick = () => { exr.sets.push({reps:"", weight:""}); renderLogExercises(container); };
    block.appendChild(addSet);

    container.appendChild(block);
  });
}

/* ---- History / progress ---- */
function viewHistory(){
  const el = document.createElement("div");
  el.innerHTML = `<h1 class="eyebrow-free-title">Progresso</h1><p class="subtitle">Só você vê estes dados — cada pessoa que usa este app tem o próprio histórico, guardado separado.</p>`;

  const chartSec = document.createElement("div");
  chartSec.className = "section";
  chartSec.innerHTML = `<h2>Evolução de carga</h2><p class="hint">Escolha um exercício para ver como sua carga máxima mudou ao longo do tempo.</p>`;

  const exNames = Array.from(new Set(
    state.sessions.flatMap(s => (s.exercises||[]).map(e => e.name))
  ));

  if (exNames.length === 0) {
    chartSec.appendChild(elFromHTML(`<div class="empty">Registre alguns treinos para ver seu gráfico de evolução aqui.</div>`));
  } else {
    const sel = document.createElement("select");
    sel.id = "pick-exercise-chart";
    exNames.forEach(n => {
      const o = document.createElement("option");
      o.value = n; o.textContent = n;
      sel.appendChild(o);
    });
    chartSec.appendChild(sel);
    const chartWrap = document.createElement("div");
    chartWrap.className = "chart-wrap";
    chartSec.appendChild(chartWrap);
    const draw = () => { chartWrap.innerHTML = ""; chartWrap.appendChild(buildProgressChart(sel.value)); };
    sel.onchange = draw;
    draw();
  }
  el.appendChild(chartSec);

  const monthSec = document.createElement("div");
  monthSec.className = "section";
  monthSec.innerHTML = `<h2>Comparativo mês a mês</h2><p class="hint">Frequência de treinos e volume total levantado, mês a mês.</p>`;
  if (!state.sessions.length) {
    monthSec.appendChild(elFromHTML(`<div class="empty">Assim que você registrar treinos em mais de um mês, o comparativo aparece aqui.</div>`));
  } else {
    const months = buildMonthlySummary(state.sessions);
    const freqWrap = document.createElement("div");
    freqWrap.innerHTML = `<div class="k" style="color:var(--text-dim);font-size:12.5px;margin-bottom:6px;">Treinos por mês</div>`;
    freqWrap.appendChild(buildBarChart(months.map(m => ({ label: m.label, value: m.count })), { suffix: "" }));
    monthSec.appendChild(freqWrap);

    const volWrap = document.createElement("div");
    volWrap.style.marginTop = "26px";
    volWrap.innerHTML = `<div class="k" style="color:var(--text-dim);font-size:12.5px;margin-bottom:6px;">Volume total (kg × reps somados)</div>`;
    volWrap.appendChild(buildBarChart(months.map(m => ({ label: m.label, value: Math.round(m.volume) })), { suffix: "kg" }));
    monthSec.appendChild(volWrap);

    if (months.length >= 2) {
      const last = months[months.length - 1];
      const prev = months[months.length - 2];
      const diff = last.volume - prev.volume;
      const pct = prev.volume > 0 ? Math.round((diff / prev.volume) * 100) : null;
      const trendTxt = diff >= 0
        ? `Seu volume subiu ${pct !== null ? pct + "%" : "em relação ao"} em relação a ${prev.label}.`
        : `Seu volume caiu ${pct !== null ? Math.abs(pct) + "%" : ""} em relação a ${prev.label}.`;
      monthSec.appendChild(elFromHTML(`<p class="hint" style="margin-top:14px;">${esc(trendTxt)}</p>`));
    }
  }
  el.appendChild(monthSec);

  const histSec = document.createElement("div");
  histSec.className = "section";
  histSec.innerHTML = `<h2>Histórico de treinos</h2>`;
  if (!state.sessions.length) {
    histSec.appendChild(elFromHTML(`<div class="empty">Nenhum treino registrado ainda. Vá em "Registrar treino" para começar.</div>`));
  } else {
    state.sessions.forEach(s => {
      const item = document.createElement("div");
      item.className = "hist-item";
      const exList = (s.exercises||[]).map(e => {
        const best = e.sets && e.sets.length ? e.sets.map(x => `${x.reps||"?"}×${x.weight||"0"}kg`).join(", ") : "";
        return `<li>${esc(e.name)} — ${esc(best)}</li>`;
      }).join("");
      item.innerHTML = `<div class="hd"><span>${esc(s.workoutName || "Treino")}</span><span class="date">${fmtDate(s.date)}</span></div><ul>${exList}</ul>`;
      histSec.appendChild(item);
    });
  }
  el.appendChild(histSec);

  return el;
}

function buildMonthlySummary(sessions){
  const map = {};
  sessions.forEach(s => {
    const d = new Date(s.date);
    if (isNaN(d)) return;
    const key = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
    if (!map[key]) map[key] = { key, count: 0, volume: 0, sortDate: new Date(d.getFullYear(), d.getMonth(), 1) };
    map[key].count += 1;
    (s.exercises||[]).forEach(e => {
      (e.sets||[]).forEach(set => {
        const reps = parseFloat(set.reps) || 0;
        const weight = parseFloat(set.weight) || 0;
        map[key].volume += reps * weight;
      });
    });
  });
  return Object.values(map)
    .sort((a,b) => a.sortDate - b.sortDate)
    .slice(-6)
    .map(m => ({
      count: m.count,
      volume: m.volume,
      label: m.sortDate.toLocaleDateString("pt-BR", { month: "short", year: "2-digit" }).replace(".", "")
    }));
}

function buildBarChart(points, opts){
  opts = opts || {};
  const suffix = opts.suffix || "";
  const w = 640, h = 170, pad = 30, gap = 14;
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);

  const maxVal = Math.max(...points.map(p => p.value), 1);
  const barW = (w - pad*2 - gap*(points.length-1)) / points.length;

  const axis = document.createElementNS(svgNS, "line");
  axis.setAttribute("x1", pad); axis.setAttribute("y1", h-30);
  axis.setAttribute("x2", w-pad); axis.setAttribute("y2", h-30);
  axis.setAttribute("stroke", "currentColor"); axis.setAttribute("opacity","0.15");
  svg.appendChild(axis);

  points.forEach((p,i) => {
    const barH = ((p.value) / maxVal) * (h - 70);
    const x = pad + i * (barW + gap);
    const y = (h - 30) - barH;

    const rect = document.createElementNS(svgNS, "rect");
    rect.setAttribute("x", x); rect.setAttribute("y", y);
    rect.setAttribute("width", barW); rect.setAttribute("height", Math.max(barH,2));
    rect.setAttribute("rx", "5");
    rect.setAttribute("fill", "var(--brass)");
    svg.appendChild(rect);

    const val = document.createElementNS(svgNS, "text");
    val.setAttribute("x", x + barW/2); val.setAttribute("y", y - 8);
    val.setAttribute("text-anchor", "middle"); val.setAttribute("font-size", "11");
    val.setAttribute("font-weight", "700"); val.setAttribute("fill", "currentColor");
    val.textContent = p.value + suffix;
    svg.appendChild(val);

    const lbl = document.createElementNS(svgNS, "text");
    lbl.setAttribute("x", x + barW/2); lbl.setAttribute("y", h - 12);
    lbl.setAttribute("text-anchor", "middle"); lbl.setAttribute("font-size", "10.5");
    lbl.setAttribute("fill", "currentColor"); lbl.setAttribute("opacity","0.6");
    lbl.textContent = p.label;
    svg.appendChild(lbl);
  });

  const holder = document.createElement("div");
  holder.style.color = "var(--text)";
  holder.appendChild(svg);
  return holder;
}

function buildProgressChart(exerciseName){
  const points = state.sessions
    .filter(s => (s.exercises||[]).some(e => e.name === exerciseName))
    .map(s => {
      const e = s.exercises.find(e => e.name === exerciseName);
      const maxW = Math.max(0, ...e.sets.map(x => parseFloat(x.weight) || 0));
      return { date: s.date, weight: maxW };
    })
    .sort((a,b) => new Date(a.date) - new Date(b.date));

  const w = 640, h = 220, pad = 36;
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);

  if (points.length < 1) {
    return elFromHTML(`<div class="empty">Sem registros para este exercício ainda.</div>`);
  }
  const maxVal = Math.max(...points.map(p=>p.weight), 1);
  const minVal = 0;
  const stepX = points.length > 1 ? (w - pad*2) / (points.length - 1) : 0;

  const toXY = (p, i) => {
    const x = pad + i * stepX;
    const y = h - pad - ((p.weight - minVal) / (maxVal - minVal || 1)) * (h - pad*2);
    return [x,y];
  };

  // axis line
  const axis = document.createElementNS(svgNS, "line");
  axis.setAttribute("x1", pad); axis.setAttribute("y1", h-pad);
  axis.setAttribute("x2", w-pad); axis.setAttribute("y2", h-pad);
  axis.setAttribute("stroke", "currentColor"); axis.setAttribute("opacity","0.2");
  svg.appendChild(axis);

  let pathD = "";
  points.forEach((p,i) => {
    const [x,y] = toXY(p,i);
    pathD += (i===0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1) + " ";
  });
  const path = document.createElementNS(svgNS, "path");
  path.setAttribute("d", pathD.trim());
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", "#B08968");
  path.setAttribute("stroke-width", "2.5");
  svg.appendChild(path);

  points.forEach((p,i) => {
    const [x,y] = toXY(p,i);
    const dot = document.createElementNS(svgNS, "circle");
    dot.setAttribute("cx", x); dot.setAttribute("cy", y); dot.setAttribute("r", "4");
    dot.setAttribute("fill", "#B08968");
    svg.appendChild(dot);

    const label = document.createElementNS(svgNS, "text");
    label.setAttribute("x", x); label.setAttribute("y", h - pad + 16);
    label.setAttribute("font-size", "9.5"); label.setAttribute("text-anchor", "middle");
    label.setAttribute("fill", "currentColor"); label.setAttribute("opacity","0.55");
    label.textContent = fmtDate(p.date);
    svg.appendChild(label);

    const valLabel = document.createElementNS(svgNS, "text");
    valLabel.setAttribute("x", x); valLabel.setAttribute("y", y - 10);
    valLabel.setAttribute("font-size", "10.5"); valLabel.setAttribute("text-anchor", "middle");
    valLabel.setAttribute("fill", "currentColor"); valLabel.setAttribute("font-weight","600");
    valLabel.textContent = p.weight + "kg";
    svg.appendChild(valLabel);
  });

  const holder = document.createElement("div");
  holder.style.color = "var(--text)";
  holder.appendChild(svg);
  return holder;
}

function elFromHTML(html){
  const d = document.createElement("div");
  d.innerHTML = html.trim();
  return d.firstChild;
}

function viewTips(){
  const el = document.createElement("div");
  el.innerHTML = `<h1 class="eyebrow-free-title">Dicas gerais</h1><p class="subtitle">Princípios que valem para qualquer objetivo, todo dia de treino.</p>`;
  const grid = document.createElement("div");
  grid.className = "tips-grid";

/* ============================= INTERACTIONS ============================= */
function wireInteractions(){
  document.querySelectorAll("[data-nav]").forEach(b => {
    b.addEventListener("click", () => setView(b.getAttribute("data-nav")));
  });
  const goalPicker = document.getElementById("goal-picker");
  if (goalPicker) {
    goalPicker.querySelectorAll("[data-goal]").forEach(b => {
      b.addEventListener("click", () => saveProfile({ goal: b.getAttribute("data-goal") }));
    });
  }
  document.querySelectorAll("[data-toggle]").forEach(h => {
    h.addEventListener("click", () => h.parentElement.classList.toggle("open"));
  });
  const logoutBtn = document.getElementById("logout-btn");
  if (logoutBtn) logoutBtn.addEventListener("click", logout);
}

boot();
})();
